substitutions:
  device_name: esp32-c3-test-ap
  friendly_name: ESP32 Test AP

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_CDC

wifi:
  ap:
    ssid: "${friendly_name}"
    password: "Test1234"

captive_portal:

web_server:
  port: 80

button:
  - platform: factory_reset
    name: "Reset WiFi"
    id: reset_wifi
    on_press:
      then:
        - logger.log: "Factory reset triggered - clearing WiFi config"
