substitutions:
  device_name: esp32-c3-laifen-bridge
  friendly_name: ESP32 Laifen Bridge
  firmware_version: "v2.5"
  laifen_mac: "FF:85:59:47:02:0F"
  laifen_service_uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
  laifen_control_char_uuid: "0000ff02-0000-1000-8000-00805f9b34fb"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "BLE bridge for Laifen L1 Pro floor lamp. Commands inferred from Android HCI snoop."
  project:
    name: "laifen.esp32-bridge"
    version: ${firmware_version}
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - script.execute: laifen_init
      - text_sensor.template.publish:
          id: firmware_version_sensor
          state: "${firmware_version}"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_CDC

api:
  services:
    - service: laifen_set_all
      variables:
        upper_on: bool
        upper_brightness: int
        lower_on: bool
        lower_brightness: int
        kelvin: int
      then:
        - script.execute:
            id: laifen_set_all
            upper_on: !lambda return upper_on;
            upper_brightness: !lambda return upper_brightness;
            lower_on: !lambda return lower_on;
            lower_brightness: !lambda return lower_brightness;
            kelvin: !lambda return kelvin;

ota:
  - platform: esphome

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  reboot_timeout: 2min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !env_var ESPHOME_FALLBACK_AP_PASSWORD
    ap_timeout: 30s
  on_connect:
    then:
      - logger.log: "WiFi connected, enabling BLE"
      - esp32_ble_tracker.start_scan:
  on_disconnect:
    then:
      - logger.log: "WiFi disconnected, disabling BLE"
      - esp32_ble_tracker.stop_scan:

captive_portal:

improv_serial:

web_server:
  port: 80
  version: 3

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 320ms
    active: false
    continuous: false

ble_client:
  - mac_address: ${laifen_mac}
    id: laifen_client
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Connected to Laifen L1 Pro"
        - delay: 2s
        - script.execute: laifen_init
    on_disconnect:
      then:
        - logger.log:
            level: WARN
            format: "Disconnected from Laifen L1 Pro"
        - lambda: id(laifen_accept_commands) = false;

text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_version_sensor
    entity_category: config
    lambda: |-
      return {"${firmware_version}"};
    update_interval: 60s

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true

  - platform: ble_client
    ble_client_id: laifen_client
    name: "Laifen Raw Notify"
    id: laifen_raw_notify
    internal: true
    service_uuid: ${laifen_service_uuid}
    characteristic_uuid: ${laifen_control_char_uuid}
    notify: true
    update_interval: never
    on_notify:
      then:
        - lambda: |-
            std::vector<uint8_t> bytes(x.begin(), x.end());
            ESP_LOGD("laifen", "Laifen RX %s", format_hex_pretty(bytes).c_str());

            // 解析状态响应 (假设格式: [0xAA, 0x01, 0x05, ...])
            if (bytes.size() >= 14 && bytes[0] == 0xAA && bytes[1] == 0x01 && bytes[2] == 0x05) {
              // 解析上灯状态
              bool upper_on = bytes[7] == 0x01;
              uint8_t upper_bri = bytes[8];
              bool lower_on = bytes[9] == 0x01;
              uint8_t lower_bri = bytes[10];

              // 解析色温 (2字节大端)
              uint16_t color_temp = (bytes[11] << 8) | bytes[12];
              if (color_temp < 2700) color_temp = 2700;
              if (color_temp > 6500) color_temp = 6500;

              // 更新实体状态
              id(laifen_upper_light).publish_state(upper_on);
              id(laifen_lower_light).publish_state(lower_on);
              id(laifen_upper_brightness).publish_state(upper_bri);
              id(laifen_lower_brightness).publish_state(lower_bri);
              id(laifen_color_temperature).publish_state(color_temp);

              ESP_LOGI("laifen", "Status parsed: upper=%d/%d lower=%d/%d temp=%dK",
                       upper_on, upper_bri, lower_on, lower_bri, color_temp);
            }

globals:
  - id: laifen_accept_commands
    type: bool
    initial_value: "false"

script:
  - id: laifen_raw_write
    mode: queued
    max_runs: 10
    parameters:
      payload: int[]
    then:
      - wait_until:
          condition:
            lambda: return id(laifen_client).connected();
          timeout: 20s
      - if:
          condition:
            lambda: return id(laifen_client).connected();
          then:
            - ble_client.ble_write:
                id: laifen_client
                service_uuid: ${laifen_service_uuid}
                characteristic_uuid: ${laifen_control_char_uuid}
                value: !lambda |-
                  std::vector<uint8_t> data;
                  data.reserve(payload.size());
                  for (const int byte : payload) {
                    data.push_back(static_cast<uint8_t>(byte));
                  }
                  return data;

  - id: laifen_init
    mode: restart
    then:
      - lambda: id(laifen_accept_commands) = false;
      - wait_until:
          condition:
            lambda: return id(laifen_client).connected();
          timeout: 20s
      - if:
          condition:
            lambda: return id(laifen_client).connected();
          then:
            - logger.log: "Laifen init sequence"
            - script.execute:
                id: laifen_raw_write
                payload: [0xAA, 0x41, 0x03, 0x00, 0x00, 0x00, 0xE8]
            - delay: 250ms
            - script.execute:
                id: laifen_raw_write
                payload: [0xAA, 0x41, 0x04, 0x00, 0x00, 0x00, 0xEF]
            - delay: 250ms
            - script.execute:
                id: laifen_raw_write
                payload: [0xAA, 0x41, 0x09, 0x00, 0x00, 0x00, 0xE2]
            - delay: 250ms
            - script.execute:
                id: laifen_raw_write
                payload: [0xAA, 0x01, 0x05, 0x00, 0x00, 0x07, 0x07, 0xEA, 0x05, 0x18, 0x01, 0x24, 0x2F, 0x53]
            - delay: 500ms
            - lambda: id(laifen_accept_commands) = true;
            - logger.log: "Laifen init complete"
          else:
            - logger.log:
                level: WARN
                format: "Laifen init skipped, BLE not connected"

  - id: laifen_send
    mode: queued
    max_runs: 20
    parameters:
      command: int
      value: int
    then:
      - wait_until:
          condition:
            lambda: return id(laifen_client).connected();
          timeout: 20s
      - if:
          condition:
            lambda: return id(laifen_client).connected() && id(laifen_accept_commands);
          then:
            - logger.log:
                format: "Laifen TX command=0x%02x value=%d"
                args: ["command", "value"]
            - ble_client.ble_write:
                id: laifen_client
                service_uuid: ${laifen_service_uuid}
                characteristic_uuid: ${laifen_control_char_uuid}
                value: !lambda |-
                  const uint8_t cmd = static_cast<uint8_t>(command);
                  const uint8_t val = static_cast<uint8_t>(clamp(value, 0, 100));
                  std::vector<uint8_t> data = {
                    0xAA, 0x03, cmd, 0x00, 0x00, 0x01, val
                  };
                  uint8_t checksum = 0;
                  for (const uint8_t byte : data) {
                    checksum ^= byte;
                  }
                  data.push_back(checksum);
                  return data;
          else:
            - logger.log:
                level: WARN
                format: "Laifen TX skipped, BLE not ready: command=0x%02x value=%d"
                args: ["command", "value"]

  - id: laifen_send_combined_state
    mode: queued
    max_runs: 10
    parameters:
      kelvin: int
    then:
      - wait_until:
          condition:
            lambda: return id(laifen_client).connected();
          timeout: 20s
      - if:
          condition:
            lambda: return id(laifen_client).connected() && id(laifen_accept_commands);
          then:
            - logger.log:
                format: "Laifen TX combined color_temperature=%dK"
                args: ["kelvin"]
            - ble_client.ble_write:
                id: laifen_client
                service_uuid: ${laifen_service_uuid}
                characteristic_uuid: ${laifen_control_char_uuid}
                value: !lambda |-
                  const uint16_t temp = static_cast<uint16_t>(clamp(kelvin, 2700, 6500));
                  const uint8_t upper_on = id(laifen_upper_light).state ? 1 : 0;
                  const uint8_t lower_on = id(laifen_lower_light).state ? 1 : 0;
                  const uint8_t upper_brightness =
                      static_cast<uint8_t>(clamp(static_cast<int>(id(laifen_upper_brightness).state), 1, 100));
                  const uint8_t lower_brightness =
                      static_cast<uint8_t>(clamp(static_cast<int>(id(laifen_lower_brightness).state), 1, 100));
                  std::vector<uint8_t> data = {
                    0xAA, 0x03, 0x06, 0x00, 0x00, 0x07, 0x00,
                    upper_on,
                    upper_brightness,
                    lower_on,
                    lower_brightness,
                    static_cast<uint8_t>((temp >> 8) & 0xFF),
                    static_cast<uint8_t>(temp & 0xFF),
                  };
                  uint8_t checksum = 0;
                  for (const uint8_t byte : data) {
                    checksum ^= byte;
                  }
                  data.push_back(checksum);
                  return data;
          else:
            - logger.log:
                level: WARN
                format: "Laifen combined TX skipped, BLE not ready: color_temperature=%dK"
                args: ["kelvin"]

  # 真正的一次性组合命令：接收所有参数
  - id: laifen_set_all
    mode: queued
    max_runs: 10
    parameters:
      upper_on: bool
      upper_brightness: int
      lower_on: bool
      lower_brightness: int
      kelvin: int
    then:
      - wait_until:
          condition:
            lambda: return id(laifen_client).connected();
          timeout: 20s
      - if:
          condition:
            lambda: return id(laifen_client).connected() && id(laifen_accept_commands);
          then:
            - logger.log:
                format: "Laifen set_all: upper=%d/%d lower=%d/%d temp=%dK"
                args: ["upper_on", "upper_brightness", "lower_on", "lower_brightness", "kelvin"]
            # 发送组合命令设置亮度和色温
            - ble_client.ble_write:
                id: laifen_client
                service_uuid: ${laifen_service_uuid}
                characteristic_uuid: ${laifen_control_char_uuid}
                value: !lambda |-
                  const uint16_t temp = static_cast<uint16_t>(clamp(kelvin, 2700, 6500));
                  const uint8_t u_on = upper_on ? 1 : 0;
                  const uint8_t l_on = lower_on ? 1 : 0;
                  const uint8_t u_bri = static_cast<uint8_t>(clamp(upper_brightness, 1, 100));
                  const uint8_t l_bri = static_cast<uint8_t>(clamp(lower_brightness, 1, 100));
                  std::vector<uint8_t> data = {
                    0xAA, 0x03, 0x06, 0x00, 0x00, 0x07, 0x00,
                    u_on, u_bri, l_on, l_bri,
                    static_cast<uint8_t>((temp >> 8) & 0xFF),
                    static_cast<uint8_t>(temp & 0xFF),
                  };
                  uint8_t checksum = 0;
                  for (const uint8_t byte : data) {
                    checksum ^= byte;
                  }
                  data.push_back(checksum);
                  return data;
            # 更新本地状态
            - lambda: |-
                id(laifen_upper_light).publish_state(upper_on);
                id(laifen_lower_light).publish_state(lower_on);
                id(laifen_upper_brightness).publish_state(upper_brightness);
                id(laifen_lower_brightness).publish_state(lower_brightness);
                id(laifen_color_temperature).publish_state(kelvin);
          else:
            - logger.log:
                level: WARN
                format: "Laifen set_all skipped, BLE not ready"

switch:
  - platform: template
    name: "Laifen Master Light"
    id: laifen_master_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute:
          id: laifen_raw_write
          payload: [0xAA, 0x01, 0x08, 0x00, 0x00, 0x01, 0x01, 0xA3]
      - lambda: |-
          id(laifen_upper_light).publish_state(true);
          id(laifen_lower_light).publish_state(true);
    turn_off_action:
      - script.execute:
          id: laifen_raw_write
          payload: [0xAA, 0x01, 0x08, 0x00, 0x00, 0x01, 0x00, 0xA2]
      - lambda: |-
          id(laifen_upper_light).publish_state(false);
          id(laifen_lower_light).publish_state(false);

  - platform: template
    name: "Laifen Upper Light"
    id: laifen_upper_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute:
          id: laifen_send
          command: 0x01
          value: 1
    turn_off_action:
      - script.execute:
          id: laifen_send
          command: 0x01
          value: 0

  - platform: template
    name: "Laifen Lower Light"
    id: laifen_lower_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute:
          id: laifen_send
          command: 0x03
          value: 1
    turn_off_action:
      - script.execute:
          id: laifen_send
          command: 0x03
          value: 0

number:
  - platform: template
    name: "Laifen Upper Brightness"
    id: laifen_upper_brightness
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100
    set_action:
      - script.execute:
          id: laifen_send
          command: 0x02
          value: !lambda return static_cast<int>(x);

  - platform: template
    name: "Laifen Lower Brightness"
    id: laifen_lower_brightness
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100
    set_action:
      - script.execute:
          id: laifen_send
          command: 0x04
          value: !lambda return static_cast<int>(x);

  - platform: template
    name: "Laifen Color Temperature"
    id: laifen_color_temperature
    min_value: 2700
    max_value: 6500
    step: 100
    unit_of_measurement: K
    optimistic: true
    restore_value: true
    initial_value: 4000
    set_action:
      - script.execute:
          id: laifen_send_combined_state
          kelvin: !lambda return static_cast<int>(x);

button:
  - platform: template
    name: "Laifen Init"
    on_press:
      - script.execute: laifen_init

  - platform: restart
    name: "Bridge Board Restart"
