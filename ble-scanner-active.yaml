substitutions:
  device_name: esp32-ble-scanner-active
  friendly_name: ESP32 BLE Scanner Active

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE

api:

wifi:
  ssid: !env_var WIFI_SSID ""
  password: !env_var WIFI_PASSWORD ""
  ap:
    ssid: "${friendly_name}"
    password: !env_var ESPHOME_FALLBACK_AP_PASSWORD "Laifen123"

captive_portal:

web_server:
  port: 80
  version: 3

esp32_ble_tracker:
  scan_parameters:
    interval: 100ms
    window: 100ms
    active: true
    duration: 60s
  on_ble_advertise:
    - then:
        - lambda: |-
            ESP_LOGD("ble_scanner", "Found device: %s, RSSI: %d, Name: %s",
              x.address_str().c_str(),
              x.get_rssi(),
              x.get_name().c_str());
